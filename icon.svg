<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="512" height="512" fill="#0066FF" rx="100"/>

  <!-- Outer circle glow -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#FFFFFF" stroke-width="8" opacity="0.3"/>

  <!-- Main chat bubble -->
  <path d="M 120 140 L 400 140 Q 420 140 420 160 L 420 320 Q 420 340 400 340 L 180 340 L 120 400 L 140 340 L 120 340 Q 100 340 100 320 L 100 160 Q 100 140 120 140"
        fill="#FFFFFF" stroke="none"/>

  <!-- Highlight reflection -->
  <ellipse cx="200" cy="200" rx="80" ry="60" fill="#FFFFFF" opacity="0.2"/>

  <!-- Text lines inside bubble (representing message/translation) -->
  <line x1="140" y1="190" x2="330" y2="190" stroke="#0066FF" stroke-width="12" stroke-linecap="round"/>
  <line x1="140" y1="240" x2="380" y2="240" stroke="#0066FF" stroke-width="12" stroke-linecap="round"/>
  <line x1="140" y1="290" x2="320" y2="290" stroke="#0066FF" stroke-width="12" stroke-linecap="round"/>

  <!-- Small accent dot (represents the "select" action) -->
  <circle cx="420" cy="100" r="30" fill="#FF6B35" stroke="#FFFFFF" stroke-width="4"/>
</svg>
